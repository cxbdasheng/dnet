name: 功能建议
description: 提出新功能或使用体验改进建议
title: "[建议]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: 提交前可先搜索是否已有类似建议。不需要提供技术方案，描述你的使用场景即可。

  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 想解决什么问题？希望 D-NET 提供什么功能或改善什么体验？
      placeholder: 我在……场景下，需要……，目前……不太方便，希望可以……。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关功能（可选）
      options:
        - DCDN
        - DDNS
        - DPF（TCP / UDP 端口转发）
        - Web 管理界面
        - 通知 / Webhook
        - 安装 / 更新 / 配置
        - 其他 / 不确定

  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 可以附上截图、参考链接或你目前的做法，没有也可以直接提交。
