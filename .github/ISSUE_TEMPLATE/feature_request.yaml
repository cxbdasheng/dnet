name: 功能请求
description: 为 D-NET 提出改进建议
title: "[功能]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: 请说明需求和期望结果，而不只描述具体实现方式。

  - type: checkboxes
    id: search_confirmation
    attributes:
      label: 已有功能请求
      description: 提交前请搜索开放和已关闭的 Issue。
      options:
        - label: 我已搜索过涵盖此建议的现有功能请求。
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      options:
        - DCDN
        - DDNS
        - Web UI
        - 配置
        - 通知和 Webhook
        - 打包和部署
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 此功能需要解决什么限制或使用场景？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你希望实现的行为或结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 请描述你考虑过的临时方案或其他做法。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可选。可提供示例、参考资料或其他有用背景。
