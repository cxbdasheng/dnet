name: 问题反馈
description: 报告报错、异常或使用中遇到的问题
title: "[问题]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: 提交前可先搜索是否已有相同问题。日志和截图请隐藏密码、AccessKey、Token 等敏感信息。

  - type: input
    id: version
    attributes:
      label: D-NET 版本
      description: 可在页面底部或通过 dnet -v 查看；无法确认时填写“不确定”。
      placeholder: v3.0.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 填写系统或设备，以及运行方式；不清楚的部分可以省略。
      placeholder: 如 Ubuntu + Docker / 飞牛 NAS + Docker / Windows + 直接运行
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: 相关功能（可选）
      options:
        - DCDN
        - DDNS
        - DPF（TCP / UDP 端口转发）
        - Web 管理界面
        - 通知 / Webhook
        - 安装 / 更新 / 配置
        - 其他 / 不确定

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明做了什么、出现什么问题，以及希望得到什么结果。偶发问题也可以反馈。
      placeholder: |
        我在……时，出现了……，希望能够……。
        如果能复现，请简单写下操作步骤。
        涉及 DCDN / DDNS 时请注明服务商；涉及 DPF 时请注明 TCP / UDP 和 IPv4 / IPv6。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 日志或截图（可选）
      description: 粘贴报错附近的日志，或直接拖入截图。也可补充已尝试的解决方法。
